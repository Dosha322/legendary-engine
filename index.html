<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap');
:root {
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --ink: #1A1D28;
    --ink-soft: #6B7280;
    --primary: #3B5998;
    --primary-dark: #2D4373;
    --primary-soft: #EEF1F8;
    --gold: #C88A2E;
    --gold-soft: #FDF6ED;
    --success: #0D9488;
    --success-soft: #E6FAF8;
    --danger: #DC2626;
    --danger-soft: #FEF2F2;
    --warning: #D97706;
    --warning-soft: #FFF7ED;
    --info: #2563EB;
    --info-soft: #EFF6FF;
    --border: #E5E7EB;
    --accent: #8B5CF6;
    --accent-soft: #F5F3FF;
}
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: 'IBM Plex Sans Arabic', sans-serif;
    background: var(--bg);
    color: var(--ink);
    direction: rtl;
    -webkit-tap-highlight-color: transparent;
}
h1,
h2,
h3,
h4,
button,
.display {
    font-family: 'Cairo', 'IBM Plex Sans Arabic', sans-serif;
}
button {
    cursor: pointer;
    border: none;
    background: none;
    font: inherit;
    color: inherit;
}
input,
select,
textarea {
    font-family: inherit;
    font-size: 15px;
}
a {
    color: inherit;
    text-decoration: none;
}
.container {
    max-width: 480px;
    margin: 0 auto;
    padding: 0 20px;
}
.wide {
    max-width: 680px;
}
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 800;
    border-radius: 14px;
    padding: 12px 16px;
    font-size: 15px;
    transition: transform .1s, box-shadow .2s;
}
.btn:active {
    transform: scale(.97);
}
.btn:disabled {
    opacity: .5;
}
.btn-lg {
    padding: 14px 18px;
    font-size: 16px;
}
.btn-sm {
    padding: 8px 12px;
    font-size: 13px;
    border-radius: 10px;
}
.btn-primary {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 4px 16px -6px rgba(59, 89, 152, .5);
}
.btn-secondary {
    background: #fff;
    color: var(--ink);
    border: 2px solid var(--border);
}
.btn-ghost {
    background: transparent;
    color: var(--ink-soft);
}
.btn-danger {
    background: var(--danger);
    color: #fff;
}
.btn-subtle {
    background: var(--primary-soft);
    color: var(--primary-dark);
}
.btn-full {
    width: 100%;
}
.card {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, .04);
}
.p3 {
    padding: 14px;
}
.p4 {
    padding: 16px;
}
.p5 {
    padding: 20px;
}
.field {
    display: block;
    margin-bottom: 16px;
}
.field-label {
    display: block;
    font-size: 13px;
    font-weight: 800;
    margin-bottom: 6px;
    color: var(--ink);
}
.field-hint {
    display: block;
    font-size: 11px;
    margin-top: 4px;
    color: var(--ink-soft);
}
.field-error {
    display: block;
    font-size: 11px;
    font-weight: 800;
    margin-top: 4px;
    color: var(--danger);
}
.input,
select.input,
textarea.input {
    width: 100%;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 15px;
    border: 1.5px solid var(--border);
    background: #FCFDFE;
    color: var(--ink);
    outline: none;
    transition: border-color .2s;
}
.input:focus {
    border-color: var(--primary);
}
.input-wrap {
    position: relative;
}
.input-icon-btn {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--ink-soft);
}
.row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.row3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
}
.badge {
    display: inline-flex;
    align-items: center;
    padding: 5px 12px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 800;
}
.progress-row {
    margin-bottom: 14px;
}
.progress-top {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    font-weight: 800;
    color: var(--ink-soft);
    margin-bottom: 5px;
}
.progress-track {
    height: 10px;
    border-radius: 99px;
    background: #EDF1F5;
    overflow: hidden;
}
.progress-fill {
    height: 100%;
    border-radius: 99px;
    transition: width .4s;
}
.tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 4px;
}
.tab {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    white-space: nowrap;
    background: #EEF1F5;
    color: var(--ink-soft);
    flex-shrink: 0;
    transition: .2s;
}
.tab.active {
    background: var(--primary);
    color: #fff;
}
.empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 10px;
    text-align: center;
}
.empty-icon {
    width: 48px;
    height: 48px;
    border-radius: 99px;
    background: #EEF1F5;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 10px;
    font-size: 20px;
}
.empty p {
    font-size: 14px;
    color: var(--ink-soft);
}
.toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 999;
    padding: 12px 20px;
    border-radius: 14px;
    color: #fff;
    font-size: 14px;
    font-weight: 800;
    box-shadow: 0 6px 24px rgba(0, 0, 0, .18);
    max-width: 90vw;
    text-align: center;
    animation: toastIn .3s ease;
}
@keyframes toastIn {
    from {
        opacity: 0;
        transform: translateX(-50%) translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
    }
}
.id-card {
    position: relative;
    overflow: hidden;
    border-radius: 20px;
    padding: 20px;
    color: #fff;
    background: linear-gradient(135deg, var(--primary-dark), #4A6FA5);
}
.id-card .glow {
    position: absolute;
    top: -40px;
    right: -40px;
    width: 160px;
    height: 160px;
    border-radius: 99px;
    background: var(--gold);
    opacity: .18;
}
.id-card .brand {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    font-weight: 800;
    opacity: .75;
}
.id-card .avatar-area {
    width: 64px;
    height: 64px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    font-weight: 800;
    background: rgba(255, 255, 255, .18);
    margin: 14px 0 12px;
    overflow: hidden;
    border: 2px solid rgba(255, 255, 255, .35);
}
.id-card .avatar-area img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.id-card h3 {
    font-size: 18px;
    font-weight: 800;
}
.id-card .sub {
    font-size: 12px;
    opacity: .8;
    margin-top: 2px;
}
.id-card .code {
    font-family: monospace;
    font-size: 15px;
    letter-spacing: .05em;
    margin-top: 8px;
    color: #F5D98B;
}
.id-card .stats {
    position: relative;
    margin-top: 16px;
    padding-top: 16px;
    border-top: 1px solid rgba(255, 255, 255, .2);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    text-align: center;
}
.id-card .stats b {
    display: block;
    font-size: 15px;
    font-weight: 800;
}
.id-card .stats span {
    font-size: 10px;
    opacity: .7;
}
.id-card .eval-chip {
    font-size: 11px;
    font-weight: 800;
    padding: 3px 8px;
    border-radius: 8px;
    background: rgba(255, 255, 255, .88);
    display: inline-block;
    color: #1A1D28;
}
.id-card .phones {
    position: relative;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid rgba(255, 255, 255, .15);
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    opacity: .85;
}

/* ============ DIAMOND ID CARD THEME (student card) ============ */
.id-card-diamond {
    position: relative;
    overflow: hidden;
    border-radius: 22px;
    padding: 2px;
    background: linear-gradient(135deg, #E8C170, #C88A2E 35%, #8a5d1c 60%, #E8C170);
    box-shadow: 0 10px 30px -12px rgba(20,30,60,.5);
}
.id-card-diamond .dc-inner {
    position: relative;
    border-radius: 20px;
    padding: 20px;
    color: #EAF1FF;
    background:
        radial-gradient(circle at 15% 10%, rgba(255,255,255,.10), transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255,255,255,.06), transparent 45%),
        linear-gradient(150deg, #0F2350, #16307A 45%, #0B1B3E 100%);
    overflow: hidden;
}
.id-card-diamond .dc-inner::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
        linear-gradient(45deg, rgba(232,193,112,.05) 25%, transparent 25%, transparent 75%, rgba(232,193,112,.05) 75%),
        linear-gradient(45deg, rgba(232,193,112,.05) 25%, transparent 25%, transparent 75%, rgba(232,193,112,.05) 75%);
    background-size: 26px 26px;
    background-position: 0 0, 13px 13px;
    opacity: .5;
    pointer-events: none;
}
.dc-brand {
    position: relative;
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    font-weight: 800;
    color: #E8C170;
    letter-spacing: .04em;
}
.dc-top {
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    margin-top: 6px;
}
.dc-photo-wrap {
    width: 86px;
    height: 86px;
    border-radius: 999px;
    margin: 0 auto 10px;
    padding: 4px;
    background: linear-gradient(135deg, #F5DFA0, #C88A2E 40%, #8a5d1c 70%, #F5DFA0);
    box-shadow: 0 0 0 1px rgba(232,193,112,.4);
}
.dc-photo {
    width: 100%;
    height: 100%;
    border-radius: 999px;
    overflow: hidden;
    background: rgba(255,255,255,.12);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    font-weight: 800;
    color: #E8C170;
    border: 2px solid #0F2350;
}
.dc-photo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.dc-center {
    position: relative;
    text-align: center;
}
.dc-name {
    font-size: 19px;
    font-weight: 800;
    color: #fff;
}
.dc-code {
    font-family: monospace;
    font-size: 13px;
    letter-spacing: .06em;
    color: #E8C170;
    margin-top: 4px;
}
.dc-sub {
    font-size: 12px;
    color: rgba(234,241,255,.7);
    margin-top: 2px;
}
.dc-status {
    position: relative;
    display: inline-flex;
    margin-top: 10px;
    font-size: 11px;
    font-weight: 800;
    padding: 4px 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, #F5DFA0, #C88A2E);
    color: #1A1200;
}
.dc-chiprow {
    position: relative;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 6px;
    margin-top: 18px;
}
.dc-chip {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 10px 4px;
    border-radius: 14px;
    background: rgba(255,255,255,.06);
    border: 1px solid rgba(232,193,112,.25);
    font-size: 10px;
    font-weight: 800;
    color: #EAF1FF;
    transition: .15s;
}
.dc-chip.active {
    background: linear-gradient(135deg, rgba(245,223,160,.22), rgba(200,138,46,.22));
    border-color: #E8C170;
    color: #F5DFA0;
}
.dc-gauges {
    position: relative;
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid rgba(232,193,112,.2);
}
.dc-gauge-title {
    font-size: 12px;
    font-weight: 800;
    color: #E8C170;
    margin-bottom: 12px;
    text-align: center;
    letter-spacing: .03em;
}
.dc-gauge-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}
.dc-gauge {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
}
.dc-gauge-track {
    width: 22px;
    height: 70px;
    border-radius: 999px;
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(232,193,112,.3);
    display: flex;
    align-items: flex-end;
    overflow: hidden;
}
.dc-gauge-fill {
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(180deg, #F5DFA0, #C88A2E);
    transition: height .5s;
}
.dc-gauge-label {
    font-size: 9px;
    font-weight: 700;
    color: rgba(234,241,255,.75);
    text-align: center;
    line-height: 1.3;
}
.dc-gauge-pct {
    font-size: 10px;
    font-weight: 800;
    color: #F5DFA0;
}
.dc-phones {
    position: relative;
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(232,193,112,.15);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;
    font-size: 11px;
    color: rgba(234,241,255,.75);
}

/* ============ ADMIN DARK GOLD THEME ============ */
.theme-dark-gold {
    background: radial-gradient(circle at 20% 0%, #241a10, #100c08 55%);
    min-height: 100vh;
    color: #F3E7CE;
}
.theme-dark-gold .app-header {
    background: rgba(16, 12, 8, .92);
    border-bottom: 1px solid #3a2f1e;
}
.theme-dark-gold .brand-logo {
    background: linear-gradient(135deg, #E8C170, #C88A2E);
}
.theme-dark-gold .icon-btn {
    background: #241d14;
    color: #d9c9a3;
}
.theme-dark-gold .tab {
    background: #1c1610;
    color: #b9a377;
}
.theme-dark-gold .tab.active {
    background: linear-gradient(135deg, #F5DFA0, #C88A2E);
    color: #1A1200;
}
.theme-dark-gold .card {
    background: #1a140d;
    border: 1px solid #3a2f1e;
    box-shadow: none;
}
.theme-dark-gold h4, .theme-dark-gold p, .theme-dark-gold span {
    color: #F3E7CE;
}
.theme-dark-gold .stat-label, .theme-dark-gold .field-hint {
    color: #a99770 !important;
}
.theme-dark-gold .stat-value {
    color: #F5DFA0 !important;
}
.theme-dark-gold .list-item-btn .card {
    background: #211a11;
}
.theme-dark-gold .field-label {
    color: #E8C170;
}
.theme-dark-gold .empty p {
    color: #a99770;
}
.gold-welcome-banner {
    margin-top: 16px;
    text-align: center;
    font-weight: 800;
    font-size: 14px;
    padding: 14px;
    border-radius: 16px;
    background: linear-gradient(135deg, #F5DFA0, #C88A2E);
    color: #1A1200;
    box-shadow: 0 8px 20px -8px rgba(200,138,46,.6);
}

/* ============ MINT & LAVENDER LANDING ============ */
.landing-mint {
    min-height: 100vh;
    background: linear-gradient(180deg, #CFF3E3 0%, #DCE3F7 55%, #E6DCF7 100%);
}
.landing-mint .brand-logo-lg {
    width: 42px;
    height: 42px;
    border-radius: 14px;
    background: linear-gradient(135deg, #34D399, #8B5CF6);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex-shrink: 0;
    overflow: hidden;
}
.landing-mint .brand-logo-lg img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.landing-mint h2 {
    color: #14202B;
}
.landing-mint .btn-mint-primary {
    background: linear-gradient(90deg, #34D399, #8B5CF6);
    color: #fff;
    box-shadow: 0 10px 24px -10px rgba(139,92,246,.55);
}
.landing-mint .btn-mint-secondary {
    background: rgba(255,255,255,.85);
    color: #14202B;
    border: none;
    box-shadow: 0 2px 10px rgba(20,32,43,.06);
}
.landing-mint .btn-mint-ghost {
    background: transparent;
    color: #4B5A6B;
}
.landing-mint .feature-chip {
    background: rgba(255,255,255,.7);
    border: none;
    box-shadow: 0 2px 10px rgba(20,32,43,.05);
}

.app-header {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(245, 247, 250, .9);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
}
.app-header-inner {
    max-width: 680px;
    margin: 0 auto;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}
.brand-logo {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 16px;
    overflow: hidden;
    flex-shrink: 0;
}
.brand-logo img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: #EEF1F5;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    transition: .2s;
}
.icon-btn:hover {
    background: #E0E4EB;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
}
th {
    background: var(--primary-soft);
    color: var(--primary-dark);
    text-align: right;
    padding: 12px;
    font-weight: 800;
    white-space: nowrap;
}
td {
    padding: 12px;
    border-top: 1px solid var(--border);
    white-space: nowrap;
}
.table-wrap {
    overflow-x: auto;
    border-radius: 12px;
}
.stat-card {
    display: flex;
    align-items: center;
    gap: 10px;
}
.stat-icon {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 16px;
}
.stat-value {
    font-size: 18px;
    font-weight: 800;
    line-height: 1;
}
.stat-label {
    font-size: 11px;
    margin-top: 4px;
    color: var(--ink-soft);
}
.grid2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}
.list-item-btn {
    width: 100%;
    text-align: right;
    display: block;
    transition: .15s;
}
.list-item-btn:active {
    opacity: .8;
}
.divide>*+* {
    border-top: 1px solid var(--border);
}
.status-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: .2s;
}
.status-btn:active {
    transform: scale(.9);
}
.photo-upload {
    display: flex;
    align-items: center;
    gap: 12px;
}
.photo-preview {
    width: 72px;
    height: 72px;
    border-radius: 18px;
    background: var(--primary-soft);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 800;
    color: var(--primary);
    overflow: hidden;
    border: 2px dashed var(--border);
    flex-shrink: 0;
}
.photo-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.photo-preview.has-photo {
    border-style: solid;
    border-color: var(--primary);
}
::-webkit-scrollbar {
    height: 0;
    width: 0;
}
.avatar-sm {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
}
.avatar-sm img {
    width: 100%;
    height: 100%;
    object-fit: cover;

        function uid(p) { return `${p}_${Date.now().toString(36)}${Math.random().toString(36).slice(2,7)}`; }

        function esc(s) { return (s === undefined || s === null) ? "" : String(s).replace(/&/g, "&amp;").replace(/</g,

        function genStudentCode(existing) {
            let c;

        function genPassword() {
            const ch = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

            try { return new Date(d).toLocaleDateString("ar-EG", { year: "numeric", month: "2-digit", day: "2-digit" }); } catch

        }

        function evalOf(avg) {
            if (avg === null || avg === undefined || isNaN(avg)) return { label: "لا يوجد تقييم بعد", color: C.inkSoft,
                bg: "#EEF1F5" };
            if (avg >= 90) return { label: "ممتاز", color: C.success, bg: C.successSoft };
            if (avg >= 80) return { label: "جيد جدًا", color: C.info, bg: C.infoSoft };
            if (avg >= 65) return { label: "جيد", color: C.primary, bg: C.primarySoft };
            if (avg >= 50) return { label: "مقبول", color: C.warning, bg: C.warningSoft };
            return { label: "ضعيف", color: C.danger, bg: C.dangerSoft };
        }

        function defaultDB() {

        function calcStats(db, studentId) {
            const grades = Object.values(db.grades).filter(g => g.studentId === studentId).sort((a, b) => a.date < b.date ? 1 : -1);
            const attendance = Object.values(db.attendance).filter(a => a.studentId === studentId).sort((a, b) => a.date < b.date ? 1 : -1);
            const pcts = grades.map(g => g.maxScore > 0 ? (g.score / g.maxScore) * 100 : 0);
            const avg = pcts.length ? pcts.reduce((a, b) => a + b, 0) / pcts.length : null;
            const avgOf = arr => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
            const testAvg = avgOf(grades.filter(g => g.type === "اختبار").map(g => (g.score / g.maxScore) * 100));
            const hwAvg = avgOf(grades.filter(g => g.type === "واجب").map(g => (g.score / g.maxScore) * 100));
            const partAvg = avgOf(grades.filter(g => g.type === "مشاركة").map(g => (g.score / g.maxScore) * 100));
            const present = attendance.filter(a => a.status === ATT.PRESENT).length;
            const late = attendance.filter(a => a.status === ATT.LATE).length;
            const absent = attendance.filter(a => a.status === ATT.ABSENT).length;
            const total = attendance.length;
            const attendanceRate = total > 0 ? ((present + late * 0.5) / total) * 100 : null;
            const absenceRate = attendanceRate !== null ? 100 - attendanceRate : null;
            return { grades, attendance, avg, present, late, absent, total, attendanceRate, absenceRate, testAvg, hwAvg,
                partAvg, evaluation: evalOf(avg) };
        }

           Real cloud database via Firebase Firestore, so the app works as a normal
           website (GitHub Pages, Netlify, any host) for every student/parent/teacher,
           not just inside a Claude Artifact. All devices read/write the SAME document
           in real time via Firestore's onSnapshot listener - no manual "sync" needed.

        const firebaseConfig = {

        firebase.initializeApp(firebaseConfig);
        const firestore = firebase.firestore();
        const dbDocRef = firestore.collection("mrdmdm").doc("main");

        let cloudAvailable = true;
        let lastKnownRaw = null;
        let applyingRemoteUpdate = false;

        async function loadDB() {
            try {
                const snap = await dbDocRef.get();
                if (snap.exists && snap.data().json) {
                    lastKnownRaw = snap.data().json;
                    cloudAvailable = true;
                    return JSON.parse(snap.data().json);
                }
            } catch (e) {
                cloudAvailable = false;
            }
            const fresh = defaultDB();
            const ok = await saveDB(fresh);
            if (ok) lastKnownRaw = JSON.stringify(fresh);
            return fresh;
        }

        async function saveDB(db) {
            try {
                const raw = JSON.stringify(db);
                await dbDocRef.set({ json: raw, updatedAt: Date.now() });
                lastKnownRaw = raw;
                cloudAvailable = true;
                return true;
            } catch (e) {
                cloudAvailable = false;
                return false;
            }
        }

        // Live real-time sync: fires automatically whenever ANY device writes to
        // the shared document, so every open device updates instantly.
        function startRealtimeSync() {
            dbDocRef.onSnapshot(
                (snap) => {
                    cloudAvailable = true;
                    if (!snap.exists) return;
                    const raw = snap.data().json;
                    if (raw && raw !== lastKnownRaw) {
                        lastKnownRaw = raw;
                        S.db = JSON.parse(raw);
                        render();
                    }
                },
                (err) => { cloudAvailable = false; render(); }
            );
        }

        // Manual "refresh now" button still supported (just re-reads once).
        async function refreshFromCloud(silent) {
            try {
                const snap = await dbDocRef.get();
                if (snap.exists && snap.data().json && snap.data().json !== lastKnownRaw) {
                    lastKnownRaw = snap.data().json;
                    S.db = JSON.parse(snap.data().json);
                    render();
                    if (!silent) showToast("تم تحديث البيانات من السحابة", "success");
                }
                cloudAvailable = true;
            } catch (e) {
                cloudAvailable = false;

        function handlePhotoUpload(inputId, stateKey) {
            const input = document.getElementById(inputId);
            if (!input || !input.files || !input.files[0]) return;
            const file = input.files[0];
            if (file.size > 2 * 1024 * 1024) { showToast("حجم الصورة يجب أن يكون أقل من 2 ميجابايت", "error"); return; }
            const reader = new FileReader();
            reader.onload = function(e) {
                S.ui[stateKey] = e.target.result;
                render();
            };
            reader.readAsDataURL(file);
        }

        function removePhoto(stateKey) {
            S.ui[stateKey] = "__REMOVE__";
            render();

            let displayPhoto = null;
            let hasPhoto = false;
            if (photoData === "__REMOVE__") {
                displayPhoto = null;
            } else if (photoData) {
                displayPhoto = photoData;
                hasPhoto = true;
            } else if (currentPhoto && currentPhoto.startsWith("data:")) {
                displayPhoto = currentPhoto;
                hasPhoto = true;

            const initial = label ? label.trim()[0] || "؟" : "؟";
            return `
        <div class="field">
          <span class="field-label">${label||"الصورة الشخصية"}</span>
          <div class="photo-upload">
            <div class="photo-preview ${hasPhoto?'has-photo':''}" id="${previewKey}">

            </div>
          </div>
        </div>`;
        }

        function submitRegister(ev) {
            ev.preventDefault();
            const vals = {
                name: document.getElementById("reg-name").value.trim(),
                studentPhone: document.getElementById("reg-sphone").value.replace(/\D/g, ""),
                guardianPhone: document.getElementById("reg-gphone").value.replace(/\D/g, ""),
                grade: document.getElementById("reg-grade").value,
                section: document.getElementById("reg-section").value,
                dob: document.getElementById("reg-dob").value,
                password: document.getElementById("reg-pass").value,
                confirm: document.getElementById("reg-confirm").value,
            };
            S.ui.regVals = vals;
            const e = {};
            if (!vals.name) e.name = "الاسم مطلوب";
            if (!/^\d{8,15}$/.test(vals.studentPhone)) e.studentPhone = "رقم هاتف غير صالح";
            if (!/^\d{8,15}$/.test(vals.guardianPhone)) e.guardianPhone = "رقم هاتف غير صالح";
            if (vals.studentPhone && vals.guardianPhone && vals.studentPhone === vals.guardianPhone) e.guardianPhone = "لا يمكن استخدام نفس رقم الطالب لولي الأمر";
            if (!vals.grade) e.grade = "اختر الصف الدراسي";
            if (!vals.dob) e.dob = "تاريخ الميلاد مطلوب";
            if (!vals.password || vals.password.length < 4) e.password = "كلمة مرور 4 أحرف على الأقل";
            if (vals.password !== vals.confirm) e.confirm = "كلمتا المرور غير متطابقتين";
            const allStudents = Object.values(S.db.students);
            if (allStudents.some(s => s.studentPhone === vals.studentPhone || s.guardianPhone === vals.studentPhone)) e.studentPhone = "هذا الرقم مستخدم بالفعل في النظام";
            if (allStudents.some(s => s.guardianPhone === vals.guardianPhone || s.studentPhone === vals.guardianPhone)) e.guardianPhone = "هذا الرقم مستخدم بالفعل في النظام";
            S.ui.regErrors = e;
            if (Object.keys(e).length) { render(); return; }
            const existingCodes = new Set(Object.values(S.db.students).map(s => s.code));
            const code = genStudentCode(existingCodes);
            const id = uid("STU");
            let photo = "";
            if (S.ui.regPhotoData && S.ui.regPhotoData !== "__REMOVE__") photo = S.ui.regPhotoData;
            const student = {
                id,
                code,
                password: vals.password,
                name: vals.name,
                photo,
                studentPhone: vals.studentPhone,
                guardianPhone: vals.guardianPhone,
                grade: vals.grade,
                section: vals.section,
                dob: vals.dob,
                status: "نشط",
                notes: [],
                createdAt: new Date().toISOString()
            };
            const newDb = { ...S.db, students: { ...S.db.students, [id]: student } };
            newDb.logs = [{ id: uid("LOG"), actor: "النظام", action: `تسجيل طالب جديد: ${student.name} (${code})`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);
            persist(newDb);
            S.ui.regCreated = student;
            S.ui.regVals = null;
            S.ui.regErrors = {};
            S.ui.regPhotoData = null;
            showToast("تم إنشاء حساب الطالب بنجاح", "success");
        }

          }).join("")}</tbody>
        </table></div>`;

        function renderAttendanceList(attendance) {

                [ATT.PRESENT]: { ic: "checkCircle", color: C.success, bg: C.successSoft },
                [ATT.ABSENT]: { ic: "xCircle", color: C.danger, bg: C.dangerSoft },
                [ATT.LATE]: { ic: "clock", color: C.warning, bg: C.warningSoft },
            };
            return `<div class="card p3 divide">${attendance.map(a=>{
            const c = cfg[a.status];
            return `<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;">
              <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:32px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:${c.bg}">${icon(c.ic,15,c.color)}</div>
                <span style="font-size:14px;font-weight:700;color:${c.color}">${a.status}</span>
              </div>
              <span style="font-size:12px;color:${C.inkSoft}">${fmtDate(a.date)}</span>
            </div>`;
          }).join("")}</div>`;
        }

        /* ============================== STAFF PORTAL ============================== */
        function screenStaffPortal() {
            const me = S.db.teachers[S.session.id];
            if (!me) return `<p style="padding:40px;text-align:center;">تعذر إيجاد بيانات الحساب</p>`;
            const isAdmin = me.role === "admin";
            const themeClass = isAdmin ? "theme-dark-gold" : "";
            if (S.ui.openStudentId) {
                return portalShell("Mr.DmDm", `${esc(me.name)} · ${isAdmin?"مدير":"مدرس"}`,
                renderStudentFile(S.ui.openStudentId, me.name), themeClass);
            }
            const tabList = [
                { id: "overview", label: "نظرة عامة", icon: "bar" },
                { id: "students", label: "الطلاب", icon: "users" },
                { id: "attendance", label: "تسجيل حضور", icon: "clipboard" },
            ];
            if (isAdmin) tabList.push({ id: "admin", label: "الإدارة", icon: "settings" });
            const t = S.ui.staffTab;
            let body = "";
            if (t === "overview") body = renderStaffOverview(isAdmin, me.name);
            else if (t === "students") body = renderStudentsList();
            else if (t === "attendance") body = renderAttendanceSession(me.name);
            else if (t === "admin" && isAdmin) body = renderAdminPanel(me.name);
            return portalShell("Mr.DmDm", `${esc(me.name)} · ${isAdmin?"مدير":"مدرس"}`, `
          ${tabs(tabList, t, "setStaffTab")}
          <div style="margin-top:16px;">${body}</div>
        `, themeClass);
        }

        function setStaffTab(id) { S.ui.staffTab = id; render(); }

        function statCard(ic, label, value, color) {
            return `<div class="card p3 stat-card">
          <div class="stat-icon" style="background:${color}18"> ${icon(ic,16,color)}</div>
          <div><div class="stat-value">${value}</div><div class="stat-label">${label}</div></div>
        </div>`;
        }

        function renderStaffOverview(isAdmin, actorName) {
            const db = S.db;
            const students = Object.values(db.students);
            const today = todayISO();
            const attToday = Object.values(db.attendance).filter(a => a.date === today);
            const presentToday = attToday.filter(a => a.status === ATT.PRESENT).length;
            const absentToday = attToday.filter(a => a.status === ATT.ABSENT).length;
            const allPcts = Object.values(db.grades).map(g => (g.score / g.maxScore) * 100);
            const avgAll = allPcts.length ? Math.round(allPcts.reduce((a, b) => a + b, 0) / allPcts.length) : null;
            const withStats = students.map(s => ({ s, stats: calcStats(db, s.id) }));
            const top = withStats.filter(x => x.stats.avg !== null).sort((a, b) => b.stats.avg - a.stats.avg).slice(0, 5);
            const needAttn = withStats.filter(x => (x.stats.avg !== null && x.stats.avg < 50) || (x.stats.attendanceRate !== null && x.stats.attendanceRate < 75));
            return `
        <div class="grid2">
          ${statCard("users","إجمالي الطلاب",students.length,isAdmin?"#E8C170":C.primary)}
          ${statCard("checkCircle","حاضرون اليوم",presentToday,isAdmin?"#E8C170":C.success)}
          ${statCard("xCircle","غائبون اليوم",absentToday,isAdmin?"#E8C170":C.danger)}
          ${statCard("bar","متوسط الدرجات",avgAll===null?"—":avgAll+"%",isAdmin?"#E8C170":C.info)}
        </div>
        <div class="card p4" style="margin-top:12px;">
          <h4 style="font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px;">${icon("award",16,isAdmin?"#E8C170":C.gold)} الأعلى أداءً</h4>
          ${top.length===0 ? `<p style="font-size:14px;color:${C.inkSoft}">لا توجد بيانات كافية بعد</p>` : `<div style="display:flex;flex-direction:column;gap:8px;">${top.map(({s,stats})=>`
            <button class="list-item-btn" style="display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:12px;background:${isAdmin?'rgba(232,193,112,.08)':C.primarySoft}" onclick="openStudent('${s.id}')">
              <span style="font-size:14px;font-weight:700;">${esc(s.name)}</span>
              ${badge(Math.round(stats.avg)+"%", isAdmin?"#1A1200":C.primaryDark, isAdmin?"#E8C170":"#fff")}
            </button>`).join("")}</div>`}
        </div>
        <div class="card p4" style="margin-top:12px;">
          <h4 style="font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:6px;">${icon("alert",16,C.danger)} يحتاجون متابعة</h4>
          ${needAttn.length===0 ? `<p style="font-size:14px;color:${C.inkSoft}">لا يوجد طلاب بحاجة لمتابعة حاليًا</p>` : `<div style="display:flex;flex-direction:column;gap:8px;">${needAttn.map(({s,stats})=>`
            <button class="list-item-btn" style="display:flex;align-items:center;justify-content:space-between;padding:8px;border-radius:12px;background:${C.dangerSoft}" onclick="openStudent('${s.id}')">
              <span style="font-size:14px;font-weight:700;color:#1A1D28;">${esc(s.name)}</span>
              <span style="font-size:12px;font-weight:700;color:${C.danger}">${stats.avg!==null && stats.avg<50 ? `متوسط ${Math.round(stats.avg)}%` : `حضور ${Math.round(stats.attendanceRate)}%`}</span>
            </button>`).join("")}</div>`}
        </div>
        <div class="card p4" style="margin-top:12px;">
          <h4 style="font-weight:800;margin-bottom:12px;">آخر العمليات</h4>
          ${db.logs.length===0 ? `<p style="font-size:14px;color:${C.inkSoft}">لا يوجد سجل بعد</p>` : `<div style="display:flex;flex-direction:column;gap:10px;">${db.logs.slice(0, 8).map(l => `
            <div style="font-size:12px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid ${C.border};padding-bottom:6px;">
              <span><strong>${esc(l.actor)}:</strong> ${esc(l.action)}</span>
              <span style="color:${C.inkSoft};font-size:10px;">${fmtDateTime(l.date)}</span>
            </div>
          `).join("")}</div>`}
        </div>`;
        }

        function renderStudentsList() {
            const db = S.db;
            let students = Object.values(db.students);
            const q = (S.ui.studentsQ || "").toLowerCase().trim();
            const gradeFilter = S.ui.studentsGrade || "";
            const sortBy = S.ui.studentsSort || "name";

            if (q) {
                students = students.filter(s => s.name.toLowerCase().includes(q) || s.code.toLowerCase().includes(q) || s.studentPhone.includes(q) || s.guardianPhone.includes(q));
            }
            if (gradeFilter) {
                students = students.filter(s => s.grade === gradeFilter);
            }

            students.sort((a, b) => {
                if (sortBy === "name") return a.name.localeCompare(b.name, "ar");
                const statsA = calcStats(db, a.id);
                const statsB = calcStats(db, b.id);
                if (sortBy === "avg") return (statsB.avg || 0) - (statsA.avg || 0);
                if (sortBy === "grade") return a.grade.localeCompare(b.grade, "ar");
                return 0;
            });

            const gradesList = [...new Set(S.db.classes.map(c => c.grade))];

            return `
        <div class="card p4" style="margin-bottom:16px;">
          <div style="display:flex;flex-direction:column;gap:12px;">
            <div class="input-wrap">
              <input class="input" placeholder="بحث باسم الطالب أو الكود أو الهاتف..." value="${esc(S.ui.studentsQ||"")}" oninput="S.ui.studentsQ=this.value; render();">
            </div>
            <div class="row2">
              <select class="input" onchange="S.ui.studentsGrade=this.value; render();">
                <option value="">كل الصفوف</option>
                ${gradesList.map(g => `<option value="${esc(g)}" ${gradeFilter===g?"selected":""}>${esc(g)}</option>`).join("")}
              </select>
              <select class="input" onchange="S.ui.studentsSort=this.value; render();">
                <option value="name" ${sortBy==="name"?"selected":""}>ترتيب حسب الاسم</option>
                <option value="avg" ${sortBy==="avg"?"selected":""}>ترتيب حسب التقييم</option>
                <option value="grade" ${sortBy==="grade"?"selected":""}>ترتيب حسب الصف</option>
              </select>
            </div>
          </div>
        </div>

        ${students.length === 0 ? `<div class="card p3">${emptyState("users", "لا يوجد طلاب يطابقون خيارات البحث")}</div>` : `
        <div style="display:flex;flex-direction:column;gap:10px;">
          ${students.map(s => {
            const stats = calcStats(db, s.id);
            const ev = stats.evaluation;
            return `
            <div class="card p4" style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
              <div style="display:flex;align-items:center;gap:12px;cursor:pointer;" onclick="openStudent('${s.id}')">
                ${renderAvatar(s.photo, s.name, "avatar-sm")}
                <div>
                  <h4 style="font-size:15px;font-weight:800;">${esc(s.name)}</h4>
                  <p style="font-size:12px;color:${C.inkSoft}">${esc(s.code)} · ${esc(s.grade)} ${s.section?`(${esc(s.section)})`:""}</p>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:8px;">
                ${badge(stats.avg===null?"—":Math.round(stats.avg)+"%", ev.color, ev.bg)}
                <button class="btn btn-sm btn-subtle" onclick="openStudent('${s.id}')">الملف</button>
              </div>
            </div>`;
          }).join("")}
        </div>`}`;
        }

        /* ============================== STUDENT FILE & EDITING ============================== */
        function openStudent(id) {
            S.ui.openStudentId = id;
            S.ui.studentFileTab = "grades";
            S.ui.showGradeForm = false;
            S.ui.editingStudent = false;
            S.ui.editPhotoData = null;
            render();
        }

        function closeStudentFile() {
            S.ui.openStudentId = null;
            render();
        }

        function renderStudentFile(studentId, actorName) {
            const student = S.db.students[studentId];
            if (!student) return `<p style="padding:20px;">الطالب غير موجود</p>`;
            const stats = calcStats(S.db, studentId);
            const t = S.ui.studentFileTab || "grades";

            let tabContent = "";

            if (t === "grades") {
                tabContent = `
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
              <h4 style="font-weight:800;">سجل الدرجات</h4>
              ${btn({label:"إضافة درجة", icon:"plus", size:"sm", action:"toggleGradeForm"})}
            </div>
            ${S.ui.showGradeForm ? renderGradeForm(studentId, actorName) : ""}
            ${renderGradesTableWithDelete(stats.grades, actorName)}`;
            } else if (t === "attendance") {
                tabContent = renderAttendanceList(stats.attendance);
            } else if (t === "notes") {
                tabContent = renderNotesTab(student, actorName);
            } else if (t === "edit") {
                tabContent = renderEditStudentForm(student, actorName);
            }

            return `
        <div style="margin-bottom:16px;">
          <button class="btn btn-sm btn-ghost" onclick="closeStudentFile()">${icon("arrowRight",16)} العودة لقائمة الطلاب</button>
        </div>
        ${idCard(student, stats, false)}
        <div style="margin-top:16px;margin-bottom:16px;">
          ${tabs([
            {id:"grades", label:"الدرجات", icon:"book"},
            {id:"attendance", label:"الحضور", icon:"clipboard"},
            {id:"notes", label:"الملاحظات", icon:"alert"},
            {id:"edit", label:"تعديل البيانات", icon:"edit"}
          ], t, "setStudentFileTab")}
        </div>
        ${tabContent}`;
        }

        function setStudentFileTab(t) {
            S.ui.studentFileTab = t;
            render();
        }

        function toggleGradeForm() {
            S.ui.showGradeForm = !S.ui.showGradeForm;
            render();
        }

        function renderGradeForm(studentId, actorName) {
            return `
        <div class="card p4" style="margin-bottom:16px;background:${C.primarySoft}">
          <h4 style="font-size:14px;font-weight:800;margin-bottom:12px;">تسجيل درجة جديدة</h4>
          <form onsubmit="submitNewGrade(event, '${studentId}', '${esc(actorName)}')">
            ${field({label:"اسم المادة / الاختبار", inner:`<input class="input" id="ng-subject" placeholder="مثال: رياضيات / اختبار الشهر" required>`})}
            <div class="row2">
              ${field({label:"نوع التقييم", inner:`<select class="input" id="ng-type">${GRADE_TYPES.map(gt=>`<option value="${gt}">${gt}</option>`).join("")}</select>`})}
              ${field({label:"عنوان الامتحان", inner:`<input class="input" id="ng-exam" placeholder="اختبار 1">`})}
            </div>
            <div class="row2">
              ${field({label:"الدرجة المحصلة", inner:`<input class="input" type="number" step="0.5" id="ng-score" required>`})}
              ${field({label:"الدرجة النهائية", inner:`<input class="input" type="number" step="0.5" id="ng-max" value="100" required>`})}
            </div>
            ${field({label:"تاريخ التقييم", inner:`<input class="input" type="date" id="ng-date" value="${todayISO()}">`})}
            <div style="display:flex;gap:8px;margin-top:10px;">
              ${btn({label:"حفظ الدرجة", type:"submit", icon:"save", size:"sm"})}
              ${btn({label:"إلغاء", variant:"ghost", size:"sm", action:"toggleGradeForm"})}
            </div>
          </form>
        </div>`;
        }

        function submitNewGrade(ev, studentId, actorName) {
            ev.preventDefault();
            const subject = document.getElementById("ng-subject").value.trim();
            const type = document.getElementById("ng-type").value;
            const examName = document.getElementById("ng-exam").value.trim() || type;
            const score = parseFloat(document.getElementById("ng-score").value);
            const maxScore = parseFloat(document.getElementById("ng-max").value);
            const date = document.getElementById("ng-date").value || todayISO();

            if (isNaN(score) || isNaN(maxScore) || maxScore <= 0) {
                showToast("برجاء إدخال قيم درجات صالحة", "error");
                return;
            }

            const gId = uid("GRD");
            const gradeObj = { id: gId, studentId, subject, type, examName, score, maxScore, date, createdAt: new Date().toISOString() };
            
            const newDb = { ...S.db, grades: { ...S.db.grades, [gId]: gradeObj } };
            const student = S.db.students[studentId];
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `إضافة درجة للطالب ${student.name}: ${score}/${maxScore} في ${subject}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            const notifId = uid("NTF");
            const notifs = newDb.notifications[studentId] || [];
            newDb.notifications[studentId] = [{ id: notifId, text: `تم إضافة درجة جديدة: ${score}/${maxScore} في ${subject}`, date: new Date().toISOString() }, ...notifs];

            persist(newDb);
            S.ui.showGradeForm = false;
            showToast("تم حفظ الدرجة وإرسال إشعار للطالب", "success");
        }

        function renderGradesTableWithDelete(grades, actorName) {
            if (!grades.length) return `<div class="card p3">${emptyState("book","لا توجد درجات مسجلة بعد")}</div>`;
            return `<div class="card table-wrap"><table>
          <thead><tr><th>المادة</th><th>النوع</th><th>الاختبار</th><th>الدرجة</th><th>النسبة</th><th>التاريخ</th><th>إجراء</th></tr></thead>
          <tbody>${grades.map(g => {
            const pct = Math.round((g.score/g.maxScore)*100);
            const ev = evalOf(pct);
            return `<tr>
              <td style="font-weight:700;">${esc(g.subject)}</td>
              <td style="color:${C.inkSoft}">${esc(g.type)}</td>
              <td style="color:${C.inkSoft}">${esc(g.examName)}</td>
              <td style="font-weight:700;">${g.score} / ${g.maxScore}</td>
              <td>${badge(pct+"%", ev.color, ev.bg)}</td>
              <td style="color:${C.inkSoft}">${fmtDate(g.date)}</td>
              <td>${confirmBtn('del_g_'+g.id, 'deleteGrade', `'${g.id}', '${esc(actorName)}'`)}</td>
            </tr>`;
          }).join("")}</tbody>
        </table></div>`;
        }

        function deleteGrade(gId, actorName) {
            const grade = S.db.grades[gId];
            if (!grade) return;
            const newGrades = { ...S.db.grades };
            delete newGrades[gId];
            const newDb = { ...S.db, grades: newGrades };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `حذف درجة للمادة ${grade.subject}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);
            persist(newDb);
            showToast("تم حذف الدرجة بنجاح", "success");
        }

        function renderNotesTab(student, actorName) {
            const notes = student.notes || [];
            return `
        <div class="card p4" style="margin-bottom:16px;">
          <h4 style="font-size:14px;font-weight:800;margin-bottom:12px;">إضافة ملاحظة جديدة للطالب</h4>
          <form onsubmit="submitStudentNote(event, '${student.id}', '${esc(actorName)}')">
            ${field({inner:`<textarea class="input" id="new-note-text" rows="3" placeholder="اكتب ملاحظة تظهر للطالب في حسابه..." required></textarea>`})}
            ${btn({label:"إضافة الملاحظة", type:"submit", icon:"plus", size:"sm"})}
          </form>
        </div>
        <div class="card p4">
          <h4 style="font-size:14px;font-weight:800;margin-bottom:12px;">الملاحظات السابقة</h4>
          ${notes.length === 0 ? emptyState("alert", "لا توجد ملاحظات مسجلة") : `
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${notes.map((n, idx) => `
            <div style="padding:10px;border-radius:12px;background:${C.goldSoft};border:1px solid ${C.gold}40;display:flex;justify-content:space-between;align-items:flex-start;">
              <div>
                <p style="font-size:14px;font-weight:700;color:${C.ink};">${esc(n.text)}</p>
                <p style="font-size:11px;color:${C.inkSoft};margin-top:4px;">${esc(n.author)} · ${fmtDateTime(n.date)}</p>
              </div>
              <button class="icon-btn" style="color:${C.danger};background:transparent" onclick="deleteStudentNote('${student.id}', ${idx}, '${esc(actorName)}')">${icon("trash",14)}</button>
            </div>`).join("")}
          </div>`}
        </div>`;
        }

        function submitStudentNote(ev, studentId, actorName) {
            ev.preventDefault();
            const text = document.getElementById("new-note-text").value.trim();
            if (!text) return;
            const student = S.db.students[studentId];
            const newNotes = [{ id: uid("NT"), text, author: actorName, date: new Date().toISOString() }, ...(student.notes || [])];
            const updatedStudent = { ...student, notes: newNotes };
            const newDb = { ...S.db, students: { ...S.db.students, [studentId]: updatedStudent } };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `إضافة ملاحظة للطالب ${student.name}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);
            persist(newDb);
            showToast("تمت إضافة الملاحظة", "success");
        }

        function deleteStudentNote(studentId, idx, actorName) {
            const student = S.db.students[studentId];
            const newNotes = [...(student.notes || [])];
            newNotes.splice(idx, 1);
            const updatedStudent = { ...student, notes: newNotes };
            const newDb = { ...S.db, students: { ...S.db.students, [studentId]: updatedStudent } };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `حذف ملاحظة للطالب ${student.name}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);
            persist(newDb);
            showToast("تم حذف الملاحظة", "success");
        }

        function renderEditStudentForm(student, actorName) {
            const grades = [...new Set(S.db.classes.map(c => c.grade))];
            const currentGrade = S.ui.editGrade || student.grade;
            const sections = [...new Set(S.db.classes.filter(c => c.grade === currentGrade).map(c => c.section))];
            
            return `
        <div class="card p5">
          <h4 style="font-size:16px;font-weight:800;margin-bottom:16px;">تعديل بيانات الطالب</h4>
          <form onsubmit="submitEditStudent(event, '${student.id}', '${esc(actorName)}')">
            ${renderPhotoUpload("تعديل صورة الطالب", "edit-photo-preview", "editPhotoData", student.photo, "edit-photo-input")}
            ${field({label:"الاسم بالكامل", inner:`<input class="input" id="es-name" value="${esc(student.name)}" required>`})}
            ${field({label:"هاتف الطالب", inner:`<input class="input" id="es-sphone" value="${esc(student.studentPhone)}" required>`})}
            ${field({label:"هاتف ولي الأمر", inner:`<input class="input" id="es-gphone" value="${esc(student.guardianPhone)}" required>`})}
            <div class="row2">
              ${field({label:"الصف الدراسي", inner:`<select class="input" id="es-grade" onchange="S.ui.editGrade=this.value; render();">${grades.map(g=>`<option value="${esc(g)}" ${currentGrade===g?"selected":""}>${esc(g)}</option>`).join("")}</select>`})}
              ${field({label:"الفصل / المجموعة", inner:`<select class="input" id="es-section">${sections.map(s=>`<option value="${esc(s)}" ${student.section===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`})}
            </div>
            ${field({label:"تاريخ الميلاد", inner:`<input class="input" type="date" id="es-dob" value="${esc(student.dob)}">`})}
            ${field({label:"حالة الحساب", inner:`<select class="input" id="es-status"><option value="نشط" ${student.status==="نشط"?"selected":""}>نشط</option><option value="موقوف" ${student.status==="موقوف"?"selected":""}>موقوف</option></select>`})}
            ${field({label:"كلمة المرور الجديدة (أتركها فارغة للحفاظ على الحالية)", inner:`<input class="input" id="es-pass" placeholder="كلمة مرور جديدة...">`})}
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:20px;">
              ${btn({label:"حفظ والتحديث", type:"submit", icon:"save", size:"lg"})}
              ${confirmBtn('del_stu_'+student.id, 'deleteStudent', `'${student.id}', '${esc(actorName)}'`)}
            </div>
          </form>
        </div>`;
        }

        function submitEditStudent(ev, studentId, actorName) {
            ev.preventDefault();
            const student = S.db.students[studentId];
            const name = document.getElementById("es-name").value.trim();
            const sPhone = document.getElementById("es-sphone").value.replace(/\D/g, "");
            const gPhone = document.getElementById("es-gphone").value.replace(/\D/g, "");
            const grade = document.getElementById("es-grade").value;
            const section = document.getElementById("es-section").value;
            const dob = document.getElementById("es-dob").value;
            const status = document.getElementById("es-status").value;
            const newPass = document.getElementById("es-pass").value.trim();

            let photo = student.photo || "";
            if (S.ui.editPhotoData === "__REMOVE__") photo = "";
            else if (S.ui.editPhotoData) photo = S.ui.editPhotoData;

            const updated = {
                ...student,
                name,
                studentPhone: sPhone,
                guardianPhone: gPhone,
                grade,
                section,
                dob,
                status,
                photo,
                password: newPass ? newPass : student.password
            };

            const newDb = { ...S.db, students: { ...S.db.students, [studentId]: updated } };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `تعديل بيانات الطالب ${name}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            persist(newDb);
            S.ui.editPhotoData = null;
            showToast("تم تحديث بيانات الطالب بنجاح", "success");
        }

        function deleteStudent(studentId, actorName) {
            const student = S.db.students[studentId];
            if (!student) return;

            const newStudents = { ...S.db.students };
            delete newStudents[studentId];

            const newDb = { ...S.db, students: newStudents };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `حذف الطالب ${student.name} (${student.code})`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            persist(newDb);
            closeStudentFile();
            showToast("تم حذف حساب الطالب بنجاح", "success");
        }

        /* ============================== ATTENDANCE SESSION ============================== */
        function renderAttendanceSession(actorName) {
            const gradesList = [...new Set(S.db.classes.map(c => c.grade))];
            const selGrade = S.ui.attGrade || gradesList[0] || "";
            const sectionsList = [...new Set(S.db.classes.filter(c => c.grade === selGrade).map(c => c.section))];
            const selSection = S.ui.attSection || sectionsList[0] || "";
            const attDate = S.ui.attDate || todayISO();

            const students = Object.values(S.db.students).filter(s => s.grade === selGrade && (!selSection || s.section === selSection));

            return `
        <div class="card p4" style="margin-bottom:16px;">
          <h4 style="font-weight:800;margin-bottom:12px;">تسجيل الحضور والغياب</h4>
          <div class="row3">
            ${field({label:"الصف", inner:`<select class="input" onchange="S.ui.attGrade=this.value; S.ui.attSection=''; render();">${gradesList.map(g => `<option value="${esc(g)}" ${selGrade===g?"selected":""}>${esc(g)}</option>`).join("")}</select>`})}
            ${field({label:"المجموعة", inner:`<select class="input" onchange="S.ui.attSection=this.value; render();">${sectionsList.map(s => `<option value="${esc(s)}" ${selSection===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`})}
            ${field({label:"التاريخ", inner:`<input class="input" type="date" value="${attDate}" onchange="S.ui.attDate=this.value; render();">`})}
          </div>
        </div>

        ${students.length === 0 ? `<div class="card p3">${emptyState("clipboard", "لا يوجد طلاب في هذا الصف / المجموعة")}</div>` : `
        <div class="card p4" style="margin-bottom:16px;">
          <div style="display:flex;flex-direction:column;gap:12px;">
            ${students.map(s => {
              const currentMark = S.ui.attMarks[s.id] || ATT.PRESENT;
              return `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid ${C.border}">
                <div style="display:flex;align-items:center;gap:10px;">
                  ${renderAvatar(s.photo, s.name, "avatar-sm")}
                  <div>
                    <span style="font-size:14px;font-weight:800;">${esc(s.name)}</span>
                    <span style="display:block;font-size:11px;color:${C.inkSoft}">${esc(s.code)}</span>
                  </div>
                </div>
                <div style="display:flex;gap:6px;">
                  <button class="status-btn" style="background:${currentMark===ATT.PRESENT?C.successSoft:'#f0f2f5'};color:${currentMark===ATT.PRESENT?C.success:C.inkSoft};border:1px solid ${currentMark===ATT.PRESENT?C.success:'transparent'}" onclick="setAttMark('${s.id}', '${ATT.PRESENT}')">${icon("check",16)}</button>
                  <button class="status-btn" style="background:${currentMark===ATT.LATE?C.warningSoft:'#f0f2f5'};color:${currentMark===ATT.LATE?C.warning:C.inkSoft};border:1px solid ${currentMark===ATT.LATE?C.warning:'transparent'}" onclick="setAttMark('${s.id}', '${ATT.LATE}')">${icon("clock",16)}</button>
                  <button class="status-btn" style="background:${currentMark===ATT.ABSENT?C.dangerSoft:'#f0f2f5'};color:${currentMark===ATT.ABSENT?C.danger:C.inkSoft};border:1px solid ${currentMark===ATT.ABSENT?C.danger:'transparent'}" onclick="setAttMark('${s.id}', '${ATT.ABSENT}')">${icon("xCircle",16)}</button>
                </div>
              </div>`;
            }).join("")}
          </div>
          ${btn({label:"حفظ كشف الحضور", action:"saveAttendanceBatch", args:`'${esc(actorName)}'`, icon:"save", full:true, size:"lg", extra:'style="margin-top:20px;"'})}
        </div>`}`;
        }

        function setAttMark(sId, status) {
            S.ui.attMarks[sId] = status;
            render();
        }

        function saveAttendanceBatch(actorName) {
            const gradesList = [...new Set(S.db.classes.map(c => c.grade))];
            const selGrade = S.ui.attGrade || gradesList[0] || "";
            const sectionsList = [...new Set(S.db.classes.filter(c => c.grade === selGrade).map(c => c.section))];
            const selSection = S.ui.attSection || sectionsList[0] || "";
            const attDate = S.ui.attDate || todayISO();

            const students = Object.values(S.db.students).filter(s => s.grade === selGrade && (!selSection || s.section === selSection));
            
            const newAtt = { ...S.db.attendance };
            students.forEach(s => {
                const status = S.ui.attMarks[s.id] || ATT.PRESENT;
                const attId = `ATT_${s.id}_${attDate}`;
                newAtt[attId] = { id: attId, studentId: s.id, date: attDate, status, createdAt: new Date().toISOString() };
            });

            const newDb = { ...S.db, attendance: newAtt };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `تسجيل حضور ${students.length} طالب لصف ${selGrade} بتاريخ ${attDate}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            persist(newDb);
            showToast("تم حفظ سجل الحضور والغياب بنجاح", "success");
        }

        /* ============================== ADMIN PANEL & CLOUD SYNC ============================== */
        function renderAdminPanel(actorName) {
            const sub = S.ui.adminSubtab || "teachers";
            let subContent = "";

            if (sub === "teachers") subContent = renderAdminTeachers(actorName);
            else if (sub === "classes") subContent = renderAdminClasses(actorName);
            else if (sub === "cloud") subContent = renderAdminCloud(actorName);
            else if (sub === "logs") subContent = renderAdminLogs();

            return `
        <div style="margin-bottom:16px;">
          ${tabs([
            {id:"teachers", label:"المساعدين والمدرسين", icon:"userCog"},
            {id:"classes", label:"الصفوف والمجموعات", icon:"school"},
            {id:"cloud", label:"السحابة والنسخ الاحتياطي", icon:"refresh"},
            {id:"logs", label:"سجل النظام", icon:"clipboard"}
          ], sub, "setAdminSubtab")}
        </div>
        ${subContent}`;
        }

        function setAdminSubtab(sub) {
            S.ui.adminSubtab = sub;
            render();
        }

        function renderAdminTeachers(actorName) {
            const teachers = Object.values(S.db.teachers);
            return `
        <div class="card p4" style="margin-bottom:16px;">
          <h4 style="font-size:15px;font-weight:800;margin-bottom:12px;">إضافة مدرس / مساعد جديد</h4>
          <form onsubmit="submitNewTeacher(event, '${esc(actorName)}')">
            ${renderPhotoUpload("صورة المدرس الشخصية", "teacher-photo-preview", "editTeacherPhotoData", null, "teacher-photo-input")}
            ${field({label:"الاسم بالكامل", inner:`<input class="input" id="nt-name" placeholder="مثال: أ/ أحمد الشامي" required>`})}
            <div class="row2">
              ${field({label:"الرتبة", inner:`<select class="input" id="nt-role"><option value="teacher">مدرس / مساعد</option><option value="admin">مدير نظام</option></select>`})}
              ${field({label:"كلمة المرور", inner:`<input class="input" id="nt-pass" value="${genPassword()}" required>`})}
            </div>
            ${btn({label:"إنشاء الحساب", type:"submit", icon:"userPlus", size:"sm"})}
          </form>
        </div>

        <div class="card p4">
          <h4 style="font-size:15px;font-weight:800;margin-bottom:12px;">قائمة الكادر التعليمي</h4>
          <div style="display:flex;flex-direction:column;gap:10px;">
            ${teachers.map(t => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:10px;border-bottom:1px solid ${C.border}">
              <div style="display:flex;align-items:center;gap:10px;">
                ${renderAvatar(t.photo, t.name, "avatar-sm")}
                <div>
                  <h4 style="font-size:14px;font-weight:800;">${esc(t.name)} ${t.role==="admin"?badge("مدير","#1A1200","#E8C170"):badge("مدرس",C.primary,C.primarySoft)}</h4>
                  <p style="font-size:12px;color:${C.inkSoft}">الكود: <code style="color:${C.gold}">${esc(t.code)}</code> | كلمة المرور: <code>${esc(t.password)}</code></p>
                </div>
              </div>
              ${t.role !== "admin" ? confirmBtn('del_tch_'+t.id, 'deleteTeacher', `'${t.id}', '${esc(actorName)}'`) : ""}
            </div>`).join("")}
          </div>
        </div>`;
        }

        function submitNewTeacher(ev, actorName) {
            ev.preventDefault();
            const name = document.getElementById("nt-name").value.trim();
            const role = document.getElementById("nt-role").value;
            const pass = document.getElementById("nt-pass").value.trim();

            if (!name || !pass) return;

            const existingCodes = new Set(Object.values(S.db.teachers).map(t => t.code));
            const code = genStaffCode(existingCodes, role);
            const id = uid("TCH");
            let photo = "";
            if (S.ui.editTeacherPhotoData && S.ui.editTeacherPhotoData !== "__REMOVE__") photo = S.ui.editTeacherPhotoData;

            const teacherObj = { id, code, password: pass, name, role, photo, createdAt: new Date().toISOString() };
            const newDb = { ...S.db, teachers: { ...S.db.teachers, [id]: teacherObj } };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `إضافة ${role==="admin"?"مدير":"مدرس"} جديد: ${name} (${code})`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            persist(newDb);
            S.ui.editTeacherPhotoData = null;
            showToast(`تم إنشاء حساب ${name} بنجاح`, "success");
        }

        function deleteTeacher(tId, actorName) {
            const teacher = S.db.teachers[tId];
            if (!teacher) return;
            const newTeachers = { ...S.db.teachers };
            delete newTeachers[tId];

            const newDb = { ...S.db, teachers: newTeachers };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `حذف حساب المدرس ${teacher.name}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            persist(newDb);
            showToast("تم حذف الحساب بنجاح", "success");
        }

        function renderAdminClasses(actorName) {
            const classes = S.db.classes || [];
            return `
        <div class="card p4" style="margin-bottom:16px;">
          <h4 style="font-size:15px;font-weight:800;margin-bottom:12px;">إضافة صف أو مجموعة جديدة</h4>
          <form onsubmit="submitNewClass(event, '${esc(actorName)}')">
            <div class="row2">
              ${field({label:"اسم الصف", inner:`<input class="input" id="nc-grade" placeholder="مثال: الصف الأول الثانوي" required>`})}
              ${field({label:"اسم المجموعة / الفصل", inner:`<input class="input" id="nc-section" placeholder="مثال: أ أو مجموعة السبت" required>`})}
            </div>
            ${btn({label:"إضافة الصف", type:"submit", icon:"plus", size:"sm"})}
          </form>
        </div>

        <div class="card p4">
          <h4 style="font-size:15px;font-weight:800;margin-bottom:12px;">الصفوف المعتمدة حاليًا</h4>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${classes.map((c, idx) => `
            <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-radius:12px;background:${C.primarySoft}">
              <span style="font-size:14px;font-weight:800;color:${C.primaryDark}">${esc(c.grade)} — مجموعة: ${esc(c.section)}</span>
              <button class="icon-btn" style="color:${C.danger};background:#fff" onclick="removeClassSection(${idx}, '${esc(actorName)}')">${icon("trash",14)}</button>
            </div>`).join("")}
          </div>
        </div>`;
        }

        function submitNewClass(ev, actorName) {
            ev.preventDefault();
            const grade = document.getElementById("nc-grade").value.trim();
            const section = document.getElementById("nc-section").value.trim();

            if (!grade || !section) return;

            const newClasses = [...(S.db.classes || []), { grade, section }];
            const newDb = { ...S.db, classes: newClasses };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `إضافة صف ومجموعة جديدة: ${grade} - ${section}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            persist(newDb);
            showToast("تمت إضافة المجموعة بنجاح", "success");
        }

        function removeClassSection(idx, actorName) {
            const newClasses = [...S.db.classes];
            const removed = newClasses.splice(idx, 1)[0];
            const newDb = { ...S.db, classes: newClasses };
            newDb.logs = [{ id: uid("LOG"), actor: actorName, action: `حذف مجموعة: ${removed?.grade} - ${removed?.section}`, date: new Date().toISOString() }, ...newDb.logs].slice(0, 300);

            persist(newDb);
            showToast("تم حذف المجموعة بنجاح", "success");
        }

        function renderAdminCloud(actorName) {
            return `
        <div class="card p5" style="margin-bottom:16px;">
          <div style="display:flex;align-items:center;gap:12px;margin-bottom:16px;">
            <div style="width:40px;height:40px;border-radius:12px;background:${C.goldSoft};display:flex;align-items:center;justify-content:center;">
              ${icon("refresh",20,C.gold)}
            </div>
            <div>
              <h4 style="font-size:16px;font-weight:800;">السحابة ومزامنة البيانات</h4>
              <p style="font-size:12px;color:${C.inkSoft}">${cloudAvailable ? "متصل بقاعدة بيانات Firebase — أي تعديل يظهر فورًا على كل الأجهزة المفتوحة" : "تعذر الوصول لقاعدة البيانات حاليًا — تحقق من الاتصال بالإنترنت"}</p>
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:12px;">
            ${btn({label:"سحب أحدث نسخة من السحابة الآن", action:"refreshFromCloud", args:"false", icon:"refresh", full:true, size:"lg"})}
            ${btn({label:"تصدير نسخة احتياطية (ملف JSON)", action:"exportDB", icon:"save", variant:"secondary", full:true})}
            <label class="btn btn-secondary btn-full" style="cursor:pointer;">
              ${icon("book",18)} استعادة نسخة احتياطية من ملف
              <input type="file" accept=".json" onchange="importDB(event, '${esc(actorName)}')" style="display:none;">
            </label>
          </div>
        </div>

        <div class="card p5" style="border:1px solid ${C.danger}40;background:${C.dangerSoft}">
          <h4 style="font-size:15px;font-weight:800;color:${C.danger};margin-bottom:8px;">إعادة ضبط النظام</h4>
          <p style="font-size:12px;color:${C.ink};margin-bottom:16px;">حذف كافة البيانات وإعادة التطبيق للوضع الافتراضي.</p>
          ${confirmBtn('reset_db_key', 'resetDatabase', `'${esc(actorName)}'`)}
        </div>`;
        }

        function exportDB() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(S.db, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `mrdmdm_backup_${todayISO()}.json`);
            document.body.appendChild(dlAnchor);
            dlAnchor.click();
            dlAnchor.remove();
            showToast("تم تحميل النسخة الاحتياطية بنجاح", "success");
        }

        function importDB(ev, actorName) {
            const file = ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (importedData && importedData.students && importedData.teachers) {
                        importedData.logs = [{ id: uid("LOG"), actor: actorName, action: "استعادة نسخة احتياطية سحابية", date: new Date().toISOString() }, ...(importedData.logs || [])].slice(0, 300);
                        persist(importedData);
                        showToast("تمت استعادة البيانات بنجاح ☁️", "success");
                    } else {
                        showToast("ملف نسخة احتياطية غير صالح", "error");
                    }
                } catch (err) {
                    showToast("حدث خطأ أثناء قراءة الملف", "error");
                }
            };
            reader.readAsText(file);
        }

        function resetDatabase(actorName) {
            const fresh = defaultDB();
            fresh.logs = [{ id: uid("LOG"), actor: actorName, action: "إعادة ضبط النظام كاملاً", date: new Date().toISOString() }];
            persist(fresh);
            showToast("تم إعادة ضبط النظام إلى الإعدادات الافتراضية", "success");
        }

        function renderAdminLogs() {
            const logs = S.db.logs || [];
            return `
        <div class="card p4">
          <h4 style="font-size:15px;font-weight:800;margin-bottom:12px;">سجل الحركات والتعديلات</h4>
          ${logs.length === 0 ? emptyState("clipboard", "لا توجد سجلات بعد") : `
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${logs.map(l => `
            <div style="padding:8px 0;border-bottom:1px solid ${C.border};display:flex;justify-content:space-between;align-items:center;">
              <div>
                <span style="font-size:13px;font-weight:700;">${esc(l.actor)}</span>:
                <span style="font-size:13px;color:${C.ink}">${esc(l.action)}</span>
              </div>
              <span style="font-size:10px;color:${C.inkSoft}">${fmtDateTime(l.date)}</span>
            </div>`).join("")}
          </div>`}
        </div>`;
        }

        /* ============================== RENDER APP ROUTER ============================== */
        function render() {
            const root = document.getElementById("root");
            if (!root) return;

            if (!S.session) {
                if (S.screen === "landing") root.innerHTML = screenLanding();
                else if (S.screen === "student-login") root.innerHTML = screenStudentLogin();
                else if (S.screen === "staff-login") root.innerHTML = screenStaffLogin();
                else if (S.screen === "register") root.innerHTML = screenRegister();
                else root.innerHTML = screenLanding();
            } else {
                if (S.session.type === "student") {
                    root.innerHTML = screenStudentPortal();
                } else if (S.session.type === "teacher" || S.session.type === "admin") {
                    root.innerHTML = screenStaffPortal();
                }
            }

            if (S.toast) {
                const toastDiv = document.createElement("div");
                toastDiv.className = "toast";
                toastDiv.style.background = S.toast.type === "error" ? C.danger : S.toast.type === "success" ? C.success : C.primary;
                toastDiv.innerText = S.toast.message;
                root.appendChild(toastDiv);
            }
        }

        async function init() {
            S.db = await loadDB();
            render();
            // Real-time listener: any device that saves updates everyone else
            // instantly (no polling needed with Firestore).
            startRealtimeSync();
        }

        window.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
